<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>得益计分 · 实时比分</title>
    <style>
        :root {
          color-scheme: light dark;
          font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          --surface-bg: #f6f8fb;
          --surface-card: #ffffff;
          --surface-border: rgba(15, 23, 42, 0.08);
          --text-primary: #0f172a;
          --text-secondary: rgba(15, 23, 42, 0.6);
          --accent: #2563eb;
        }

        html,
        body {
          margin: 0;
          height: 100%;
          overflow: hidden;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: stretch;
          background: var(--surface-bg);
          color: var(--text-primary);
          padding: 24px 16px 20px;
          box-sizing: border-box;
        }

        body[data-theme="dark"] {
          --surface-bg: #0f172a;
          --surface-card: rgba(30, 41, 59, 0.84);
          --surface-border: rgba(148, 163, 184, 0.26);
          --text-primary: #e2e8f0;
          --text-secondary: rgba(226, 232, 240, 0.72);
          --accent: #60a5fa;
        }

        .container {
          width: min(1080px, 100%);
          display: flex;
          flex-direction: column;
          gap: 16px;
          max-height: 100%;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 16px;
        }

        .header-main {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
          flex: 1 1 320px;
        }

        .title-row {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 12px;
        }

        h1 {
          margin: 0;
          font-size: 30px;
          font-weight: 700;
        }

        .meta {
          margin: 0;
          font-size: 15px;
          color: var(--text-secondary);
          line-height: 1.5;
          word-break: break-word;
        }

        .status {
          border-radius: 12px;
          padding: 12px 16px;
          background: rgba(37, 99, 235, 0.14);
          border-left: 4px solid var(--accent);
          color: var(--accent);
          display: none;
        }

        .status.show {
          display: block;
        }

        .status.warn {
          background: rgba(245, 158, 11, 0.16);
          border-left-color: #f59e0b;
          color: #b45309;
        }

        body[data-theme="dark"] .status.warn {
          color: #fde68a;
        }

        .status.error {
          background: rgba(239, 68, 68, 0.16);
          border-left-color: #ef4444;
          color: #b91c1c;
        }

        body[data-theme="dark"] .status.error {
          color: #fecaca;
        }

        .scoreboard-card {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
          background: var(--surface-card);
          border-radius: 20px;
          border: 1px solid var(--surface-border);
          box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
          padding: 20px;
        }

        .table-wrapper {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }

        .table-scroll {
          flex: 1;
          min-height: 0;
          overflow: auto;
        }

        .player-grid {
          display: grid;
          gap: 16px;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          padding-bottom: 8px;
        }

        .player-card {
          position: relative;
          border-radius: 18px;
          padding: 18px 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          border: 1px solid rgba(37, 99, 235, 0.18);
          background: rgba(37, 99, 235, 0.12);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .player-card:hover {
          transform: translateY(-6px);
          box-shadow: 0 18px 28px rgba(15, 23, 42, 0.16);
        }

        .player-avatar {
          width: 68px;
          height: 68px;
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
          font-weight: 700;
          background: rgba(255, 255, 255, 0.78);
          color: var(--card-accent, var(--accent));
        }

        body[data-theme="dark"] .player-card {
          border-color: rgba(96, 165, 250, 0.4);
          background: rgba(96, 165, 250, 0.18);
        }

        .player-name {
          font-size: 16px;
          font-weight: 600;
          text-align: center;
          color: var(--text-primary);
        }

        .player-rank {
          font-size: 14px;
          color: var(--text-secondary);
          min-height: 18px;
        }

        .player-score {
          font-size: 34px;
          font-weight: 800;
          color: var(--card-accent, var(--accent));
          letter-spacing: 1px;
        }

        .summary-grid {
          display: grid;
          gap: 12px;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .summary-card {
          border-radius: 14px;
          padding: 14px;
          background: rgba(37, 99, 235, 0.1);
          border: 1px solid rgba(37, 99, 235, 0.18);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        body[data-theme="dark"] .summary-card {
          background: rgba(37, 99, 235, 0.18);
          border-color: rgba(96, 165, 250, 0.42);
        }

        .summary-card h3 {
          margin: 0;
          font-size: 15px;
          font-weight: 600;
          color: var(--text-secondary);
        }

        .summary-card span {
          font-size: 24px;
          font-weight: 700;
          color: var(--text-primary);
        }

        .empty {
          padding: 48px 0;
          text-align: center;
          color: var(--text-secondary);
          font-size: 16px;
        }

        .promo-card {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 14px;
          border-radius: 12px;
          background: rgba(37, 99, 235, 0.12);
          border: 1px solid rgba(37, 99, 235, 0.2);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
          max-width: 360px;
        }

        body[data-theme="dark"] .promo-card {
          background: rgba(37, 99, 235, 0.24);
          border-color: rgba(148, 163, 184, 0.38);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
        }

        .promo-qr {
          flex-shrink: 0;
          width: 76px;
          height: 76px;
          border-radius: 12px;
          border: 1px solid rgba(148, 163, 184, 0.3);
          background: #ffffff;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        body[data-theme="dark"] .promo-qr {
          border-color: rgba(148, 163, 184, 0.42);
          background: rgba(226, 232, 240, 0.05);
        }

        .promo-qr img {
          width: 100%;
          height: 100%;
          border-radius: 10px;
          object-fit: cover;
          image-rendering: pixelated;
          display: block;
        }

        .promo-text {
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12.5px;
        }

        .promo-text strong {
          font-size: 15px;
          font-weight: 600;
        }

        .promo-text span {
          color: rgba(15, 23, 42, 0.72);
          line-height: 1.4;
        }

        body[data-theme="dark"] .promo-text span {
          color: rgba(226, 232, 240, 0.7);
        }

        .promo-text a {
          color: #1d4ed8;
          font-weight: 600;
          text-decoration: none;
          white-space: nowrap;
        }

        body[data-theme="dark"] .promo-text a {
          color: #bfdbfe;
        }

    @media (max-width: 820px) {
      body {
        padding: 16px 12px;
      }

      .container {
        height: auto;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      header > * {
        width: 100%;
      }

      .header-main {
        flex: none;
      }

      .scoreboard-card {
        flex: none;
        min-height: 420px;
      }

      .promo-card {
        width: 100%;
      }
    }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-main">
            <div class="title-row">
                <h1 id="title">实时比分</h1>
            </div>
            <p class="meta" id="meta">正在连接主机...</p>
        </div>
        <div class="promo-card">
            <div class="promo-qr">
                <img alt="下载二维码" src="/assets/qr-download.svg"/>
            </div>
            <div class="promo-text">
                <strong>下载「得益计分」App</strong>
                <span>支持多种计分与联赛管理，还可局域网实时联机</span>
                <a href="https://counters.devyi.com/download/?ref=lan" rel="noopener noreferrer"
                   target="_blank">counters.devyi.com/download</a>
            </div>
        </div>
    </header>

    <div class="status" id="status"></div>

    <div class="scoreboard-card">
        <div class="table-wrapper">
            <div class="table-scroll" id="tableScroll">
                <div class="empty">正在等待主机推送比分...</div>
            </div>
        </div>
        <div class="summary-grid" id="summary"></div>
    </div>
</div>

<script>
    (function () {
      const titleEl = document.getElementById('title');
      const statusEl = document.getElementById('status');
      const metaEl = document.getElementById('meta');
      const tableScrollEl = document.getElementById('tableScroll');
      const summaryEl = document.getElementById('summary');

      const palette = [
        '#3b82f6', '#22c55e', '#a855f7', '#f59e0b', '#0ea5e9',
        '#ec4899', '#6366f1', '#14b8a6', '#f97316', '#8b5cf6'
      ];

      const state = {
        lastSignature: null,
      };

      function setStatus(message, level) {
        if (!message) {
          statusEl.className = 'status';
          statusEl.textContent = '';
          return;
        }
        statusEl.className = 'status show' + (level ? ' ' + level : '');
        statusEl.textContent = message;
      }

      function formatTime(isoString) {
        if (!isoString) return '未知时间';
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return '未知时间';
        return date.toLocaleTimeString();
      }

      function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return hash;
      }

      function colorFromPalette(key) {
        const index = Math.abs(hashCode(key || 'counter')) % palette.length;
        const hex = palette[index];
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return {
          accent: `rgb(${r}, ${g}, ${b})`,
          background: `rgba(${r}, ${g}, ${b}, 0.18)`,
          border: `rgba(${r}, ${g}, ${b}, 0.36)`,
        };
      }

      function colorFromNumber(value) {
        if (!value) return null;
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) {
          return null;
        }
        const hex = parsed.toString(16).padStart(8, '0');
        const r = parseInt(hex.slice(2, 4), 16);
        const g = parseInt(hex.slice(4, 6), 16);
        const b = parseInt(hex.slice(6, 8), 16);
        return {
          accent: `rgb(${r}, ${g}, ${b})`,
          background: `rgba(${r}, ${g}, ${b}, 0.2)`,
          border: `rgba(${r}, ${g}, ${b}, 0.36)`,
        };
      }

      function resolveColor(player) {
        return colorFromNumber(player.avatarColor) ||
          colorFromPalette(player.playerId || player.id || player.name || '');
      }

      function resolveAvatar(player) {
        const avatar = player.avatar;
        if (!avatar || avatar === 'default_avatar.png') {
          const text = (player.name || '?').trim();
          return text ? text.slice(0, 1).toUpperCase() : '?';
        }
        if (/^\d+$/.test(avatar)) {
          const text = (player.name || '?').trim();
          return text ? text.slice(0, 1).toUpperCase() : '?';
        }
        return avatar.slice(0, 2);
      }

      function createSignature(players) {
        return JSON.stringify(players.map(player => ({
          id: player.playerId || player.id || player.name || '',
          total: player.totalScore ?? 0,
        })));
      }

      function renderSummary(players) {
        if (!players.length) {
          summaryEl.innerHTML = '';
          return;
        }

        const totals = players.map(p => Number(p.totalScore ?? 0));
        const max = Math.max(...totals);
        const min = Math.min(...totals);
        const sum = totals.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / totals.length).toFixed(1);
        const leader = players.find(p => (p.totalScore ?? 0) === max);
        const trailer = players.slice().reverse().find(p => (p.totalScore ?? 0) === min);

        summaryEl.innerHTML = `
          <div class="summary-card">
            <h3>领先玩家</h3>
            <span>${leader ? `${leader.name} · ${leader.totalScore}` : '--'}</span>
          </div>
          <div class="summary-card">
            <h3>平均计数</h3>
            <span>${avg}</span>
          </div>
          <div class="summary-card">
            <h3>落后玩家</h3>
            <span>${trailer ? `${trailer.name} · ${trailer.totalScore}` : '--'}</span>
          </div>
        `;
      }

      function renderGrid(players, rankingMap) {
        if (!players.length) {
          tableScrollEl.innerHTML = '<div class="empty">暂无玩家数据，请先在主机端添加玩家。</div>';
          return;
        }

        const cards = players.map(player => {
          const id = player.playerId || player.id || player.name || '';
          const total = Number(player.totalScore ?? 0);
          const rank = rankingMap.get(id) ?? player.rank ?? null;
          const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
          const color = resolveColor(player);
          const avatar = resolveAvatar(player);

          const style = `
            background:${color.background};
            border:1px solid ${color.border};
            --card-accent:${color.accent};
          `;

          const rankLabel = rank ? `${medal} 第${rank}名` : medal ? medal : '';

          return `
            <div class="player-card" style="${style}">
              <div class="player-avatar">${avatar}</div>
              <div class="player-name">${player.name || '未知玩家'}</div>
              <div class="player-rank">${rankLabel}</div>
              <div class="player-score">${total}</div>
            </div>
          `;
        }).join('');

        tableScrollEl.innerHTML = `<div class="player-grid">${cards}</div>`;
      }

      function renderScoreboard(data) {
        if (!data || data.status === 'loading') {
          setStatus('计数数据加载中，请稍候...', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">正在等待主机推送数据...</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'error') {
          setStatus(data.message || '获取计数数据时出现错误', 'error');
          tableScrollEl.innerHTML = '<div class="empty">请检查主机端是否在线。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'no_player') {
          setStatus(data.message || '当前模板未配置玩家', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">请在主机端补充玩家后再试。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status !== 'ok') {
          setStatus(data.message || '计数数据准备中', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">计分尚未开始，稍后再来看看。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        setStatus('', null);

        const meta = data.meta || {};
        const players = data.playersOrdered || data.players || [];
        const ranking = data.players || [];
        const updatedAt = formatTime(data.updatedAt);
        const settings = meta.otherSettings || {};
        const templateName = meta.templateName || '实时比分';
        const targetScore = meta.targetScore;

        titleEl.textContent = `${templateName} · 实时比分`;
        metaEl.textContent =
          `玩家数：${players.length} ｜ ` +
          `${targetScore ? `目标值：${targetScore} ｜ ` : ''}刷新时间：${updatedAt}`;

        if (!players.length) {
          tableScrollEl.innerHTML = '<div class="empty">暂无玩家数据，请先在主机端添加玩家。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        const rankingMap = new Map();
        ranking.forEach(player => {
          const key = player.playerId || player.id || player.name;
          if (key != null) {
            rankingMap.set(key, player.rank);
          }
        });

        renderGrid(players, rankingMap);
        renderSummary(ranking);

        const signature = createSignature(players);
        const isInitial = state.lastSignature == null;
        const changed = state.lastSignature !== signature;
        if (changed) {
          requestAnimationFrame(() => tableScrollEl.scrollTo({
            top: Math.max(tableScrollEl.scrollHeight - tableScrollEl.clientHeight, 0),
            behavior: isInitial ? 'auto' : 'smooth',
          }));
          state.lastSignature = signature;
        }
      }

      async function fetchScore() {
        try {
          const response = await fetch('/api/score', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('网络请求失败');
          }
          const data = await response.json();
          renderScoreboard(data);
        } catch (error) {
          setStatus('无法获取计数数据，请确认主机是否在线。', 'error');
          tableScrollEl.innerHTML = '<div class="empty">网络连接异常，请稍后刷新。</div>';
          summaryEl.innerHTML = '';
          console.error(error);
        }
      }

      fetchScore();
      setInterval(fetchScore, 2000);
    })();
</script>
</body>
</html>
