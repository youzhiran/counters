<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>得益计分 · 实时比分</title>
    <style>
        :root {
          color-scheme: light dark;
          font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          --surface-bg: #f5f7fd;
          --surface-card: #ffffff;
          --surface-border: rgba(15, 23, 42, 0.08);
          --text-primary: #0f172a;
          --text-secondary: rgba(15, 23, 42, 0.62);
          --accent: #f97316;
          --green: #16a34a;
          --red: #dc2626;
          --purple: #a855f7;
          --table-head-bg: #fee8d8;
        }

        html,
        body {
          margin: 0;
          height: 100%;
          overflow: hidden;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: stretch;
          background: var(--surface-bg);
          color: var(--text-primary);
          padding: 24px 16px 20px;
          box-sizing: border-box;
        }

        body[data-theme="dark"] {
          --surface-bg: #0f172a;
          --surface-card: rgba(30, 41, 59, 0.8);
          --surface-border: rgba(148, 163, 184, 0.28);
          --text-primary: #e2e8f0;
          --text-secondary: rgba(226, 232, 240, 0.72);
          --accent: #fb923c;
          --table-head-bg: #2a344d;
        }

        .container {
          width: min(1140px, 100%);
          display: flex;
          flex-direction: column;
          gap: 16px;
          max-height: 100%;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 16px;
        }

        .header-main {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
          flex: 1 1 320px;
        }

        .title-row {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 12px;
        }

        h1 {
          margin: 0;
          font-size: 30px;
          font-weight: 700;
        }

        .meta {
          margin: 0;
          font-size: 15px;
          color: var(--text-secondary);
          line-height: 1.5;
          word-break: break-word;
        }

        .status {
          border-radius: 12px;
          padding: 12px 16px;
          background: rgba(249, 115, 22, 0.16);
          border-left: 4px solid var(--accent);
          color: var(--accent);
          display: none;
        }

        .status.show {
          display: block;
        }

        .status.warn {
          background: rgba(245, 158, 11, 0.16);
          border-left-color: #f59e0b;
          color: #b45309;
        }

        body[data-theme="dark"] .status.warn {
          color: #fde68a;
        }

        .status.error {
          background: rgba(239, 68, 68, 0.16);
          border-left-color: #ef4444;
          color: #b91c1c;
        }

        body[data-theme="dark"] .status.error {
          color: #fecaca;
        }

        .scoreboard-card {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
          background: var(--surface-card);
          border-radius: 20px;
          border: 1px solid var(--surface-border);
          box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
          padding: 20px;
        }

        .table-wrapper {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }

        .table-scroll {
          flex: 1;
          min-height: 0;
          overflow: auto;
          position: relative;
        }

        table {
          width: 100%;
          border-collapse: separate;
          border-spacing: 0;
          min-width: 720px;
        }

        thead th {
          background-color: var(--table-head-bg);
          font-weight: 600;
          text-align: center;
          padding: 14px 12px;
          border-bottom: 1px solid var(--surface-border);
          position: sticky;
          top: 0;
          z-index: 2;
        }

        tbody tr:nth-child(odd) {
          background: rgba(15, 23, 42, 0.02);
        }

        tbody tr:nth-child(even) {
          background: rgba(15, 23, 42, 0.04);
        }

        tbody tr.current-round {
          background: rgba(249, 115, 22, 0.16);
        }

        th,
        td {
          padding: 12px;
          text-align: center;
          border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        .round-header {
          display: flex;
          flex-direction: column;
          gap: 6px;
          align-items: flex-start;
        }

        .round-title {
          font-weight: 700;
          font-size: 16px;
        }

        .round-meta {
          font-size: 12px;
          color: var(--text-secondary);
        }

        .round-result {
          font-size: 12px;
          font-weight: 700;
          padding: 2px 8px;
          border-radius: 999px;
          background: rgba(34, 197, 94, 0.16);
          color: #15803d;
        }

        .round-result.landlord {
          background: rgba(249, 115, 22, 0.18);
          color: #c2410c;
        }

        td .cell {
          position: relative;
          min-height: 64px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          font-weight: 600;
        }

        .cell .total.placeholder {
          color: var(--text-secondary);
          font-weight: 500;
        }

        .cell .delta {
          position: absolute;
          top: 6px;
          right: 8px;
          font-size: 12px;
          font-weight: 600;
          color: rgba(15, 23, 42, 0.52);
        }

        body[data-theme="dark"] .cell .delta {
          color: rgba(226, 232, 240, 0.7);
        }

        .cell .delta.positive {
          color: var(--green);
        }

        .cell .delta.negative {
          color: var(--red);
        }

        .cell .delta.placeholder {
          color: rgba(148, 163, 184, 0.7);
        }

        .landlord-flag {
          position: absolute;
          top: 6px;
          left: 8px;
          font-size: 11px;
          font-weight: 700;
          padding: 3px 6px;
          border-radius: 999px;
          background: rgba(249, 115, 22, 0.18);
          color: var(--accent);
        }

        .badges {
          position: absolute;
          bottom: 6px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 4px;
          flex-wrap: wrap;
          justify-content: center;
        }

        .badge {
          font-size: 11px;
          font-weight: 600;
          padding: 2px 6px;
          border-radius: 999px;
          letter-spacing: 0.4px;
        }

        .badge.bomb {
          background: rgba(239, 68, 68, 0.16);
          color: var(--red);
        }

        .badge.rocket {
          background: rgba(168, 85, 247, 0.16);
          color: var(--purple);
        }

        .badge.spring {
          background: rgba(34, 197, 94, 0.16);
          color: var(--green);
        }

        .summary-grid {
          display: grid;
          gap: 12px;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .summary-card {
          border-radius: 14px;
          padding: 14px;
          background: rgba(249, 115, 22, 0.12);
          border: 1px solid rgba(249, 115, 22, 0.24);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        body[data-theme="dark"] .summary-card {
          background: rgba(249, 115, 22, 0.22);
          border-color: rgba(251, 146, 60, 0.38);
        }

        .summary-card h3 {
          margin: 0;
          font-size: 15px;
          font-weight: 600;
          color: var(--text-secondary);
        }

        .summary-card span {
          font-size: 24px;
          font-weight: 700;
          color: var(--text-primary);
        }

        .empty {
          padding: 48px 0;
          text-align: center;
          color: var(--text-secondary);
          font-size: 16px;
        }

        .promo-card {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 14px;
          border-radius: 12px;
          background: rgba(249, 115, 22, 0.16);
          border: 1px solid rgba(249, 115, 22, 0.22);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
          max-width: 360px;
        }

        body[data-theme="dark"] .promo-card {
          background: rgba(249, 115, 22, 0.28);
          border-color: rgba(148, 163, 184, 0.38);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
        }

        .promo-qr {
          flex-shrink: 0;
          width: 76px;
          height: 76px;
          border-radius: 12px;
          border: 1px solid rgba(148, 163, 184, 0.3);
          background: #ffffff;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        body[data-theme="dark"] .promo-qr {
          border-color: rgba(148, 163, 184, 0.42);
          background: rgba(226, 232, 240, 0.05);
        }

        .promo-qr img {
          width: 100%;
          height: 100%;
          border-radius: 10px;
          object-fit: cover;
          image-rendering: pixelated;
          display: block;
        }

        .promo-text {
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12.5px;
        }

        .promo-text strong {
          font-size: 15px;
          font-weight: 600;
        }

        .promo-text span {
          color: rgba(15, 23, 42, 0.72);
          line-height: 1.4;
        }

        body[data-theme="dark"] .promo-text span {
          color: rgba(226, 232, 240, 0.7);
        }

        .promo-text a {
          color: #c2410c;
          font-weight: 600;
          text-decoration: none;
          white-space: nowrap;
        }

        body[data-theme="dark"] .promo-text a {
          color: #fdba74;
        }

    @media (max-width: 820px) {
      body {
        padding: 16px 12px;
      }

      .container {
        height: auto;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      header > * {
        width: 100%;
      }

      .header-main {
        flex: none;
      }

      .scoreboard-card {
        flex: none;
        min-height: 440px;
      }

      .promo-card {
        width: 100%;
      }

      .round-header {
        align-items: center;
      }
    }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-main">
            <div class="title-row">
                <h1 id="title">实时比分</h1>
            </div>
            <p class="meta" id="meta">正在获取对局信息...</p>
        </div>
        <div class="promo-card">
            <div class="promo-qr">
                <img alt="下载二维码" src="/assets/qr-download.svg"/>
            </div>
            <div class="promo-text">
                <strong>下载「得益计分」App</strong>
                <span>支持多种计分与联赛管理，还可局域网实时联机</span>
                <a href="https://counters.devyi.com/download/?ref=lan" rel="noopener"
                   target="_blank">
                    counters.devyi.com/download
                </a>
            </div>
        </div>
    </header>

    <div class="status" id="status"></div>

    <div class="scoreboard-card">
        <div class="table-wrapper">
            <div class="table-scroll" id="tableScroll">
                <div class="empty">正在等待主机推送比分...</div>
            </div>
        </div>
        <div class="summary-grid" id="summary"></div>
    </div>
</div>

<script>
    (function () {
      const titleEl = document.getElementById('title');
      const statusEl = document.getElementById('status');
      const metaEl = document.getElementById('meta');
      const tableScrollEl = document.getElementById('tableScroll');
      const summaryEl = document.getElementById('summary');

      const state = {
        lastSignature: null,
      };

      function setStatus(message, level) {
        if (!message) {
          statusEl.className = 'status';
          statusEl.textContent = '';
          return;
        }
        statusEl.className = 'status show' + (level ? ' ' + level : '');
        statusEl.textContent = message;
      }

      function formatTime(isoString) {
        if (!isoString) return '未知时间';
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return '未知时间';
        return date.toLocaleTimeString();
      }

      function createSignature(players, roundCount) {
        return JSON.stringify({
          roundCount,
          players: players.map(player => ({
            id: player.playerId || player.id || player.name || '',
            scores: Array.isArray(player.roundScores) ? player.roundScores : [],
            total: player.totalScore ?? 0,
            extended: Array.isArray(player.roundExtended) ? player.roundExtended : [],
          })),
        });
      }

      function scrollToBottom(el, smooth) {
        if (!el) return;
        const top = Math.max(el.scrollHeight - el.clientHeight, 0);
        el.scrollTo({
          top,
          behavior: smooth ? 'smooth' : 'auto',
        });
      }

      function extractRoundInfo(details, roundIndex, templateBase) {
        for (const detail of details) {
          const extended = detail.roundExtended[roundIndex];
          if (extended) {
            const extraBase = Number(extended.baseScore ?? 1);
            const multiplier = Number(extended.multiplier ?? 1);
            const landlordWin = extended.landlordWin;
            return {
              extraBase,
              multiplier,
              landlordWin,
              baseValue: templateBase * extraBase * multiplier,
            };
          }
        }
        return null;
      }

      function buildBadges(extended) {
        if (!extended) return '';
        const badges = [];
        if (extended.bomb && Number(extended.bomb) > 0) {
          badges.push(`<span class="badge bomb">炸×${extended.bomb}</span>`);
        }
        if (extended.rocket) {
          badges.push('<span class="badge rocket">火箭</span>');
        }
        if (extended.spring) {
          badges.push('<span class="badge spring">春天</span>');
        }
        return badges.length ? `<div class="badges">${badges.join('')}</div>` : '';
      }

      function renderSummary(players, roundCount) {
        if (!players.length) {
          summaryEl.innerHTML = '';
          return;
        }
        const leader = players[0];
        const trailer = players[players.length - 1];
        summaryEl.innerHTML = `
          <div class="summary-card">
            <h3>领先玩家</h3>
            <span>${leader ? `${leader.name} · ${leader.totalScore}` : '--'}</span>
          </div>
          <div class="summary-card">
            <h3>回合数量</h3>
            <span>${roundCount}</span>
          </div>
          <div class="summary-card">
            <h3>落后玩家</h3>
            <span>${trailer ? `${trailer.name} · ${trailer.totalScore}` : '--'}</span>
          </div>
        `;
      }

      function renderTable(playerDetails, roundCount, currentRound, templateBase) {
        if (!roundCount) {
          tableScrollEl.innerHTML = '<div class="empty">尚未开始计分，等待第一局录入。</div>';
          return;
        }

        const headerCells = playerDetails
          .map(detail => `<th>${detail.name}</th>`)
          .join('');

        const rows = [];
        for (let roundIndex = 0; roundIndex < roundCount; roundIndex++) {
          const isCurrent = currentRound === roundIndex + 1;
          const info = extractRoundInfo(playerDetails, roundIndex, templateBase);
          const roundMeta = info
            ? `<div class="round-meta">底分 ${templateBase} × ${info.extraBase} ｜ 倍数 ×${info.multiplier} ｜ 结算 ${info.baseValue}</div>`
            : '';
          const resultText = info?.landlordWin === true
            ? '<div class="round-result landlord">地主胜</div>'
            : info?.landlordWin === false
              ? '<div class="round-result">农民胜</div>'
              : '';

          const header = `
            <th>
              <div class="round-header">
                <div class="round-title">第${roundIndex + 1}局</div>
                ${roundMeta}
                ${resultText}
              </div>
            </th>
          `;

          const cells = playerDetails.map(detail => {
            const deltaRaw = detail.roundScores[roundIndex];
            const delta = deltaRaw != null ? Number(deltaRaw) : null;
            const total = detail.totals[roundIndex] ?? 0;
            const extended = detail.roundExtended[roundIndex];

            const totalClass = delta == null ? 'total placeholder' : 'total';
            const deltaClass = delta == null
              ? 'delta placeholder'
              : delta > 0
                ? 'delta positive'
                : delta < 0
                  ? 'delta negative'
                  : 'delta';
            const deltaText = delta == null ? '--' : (delta >= 0 ? `+${delta}` : `${delta}`);
            const landlordFlag = extended?.isLandlord
              ? '<div class="landlord-flag">地主</div>'
              : '';
            const badges = buildBadges(extended);

            return `
              <td>
                <div class="cell">
                  ${landlordFlag}
                  <span class="${totalClass}">${delta == null ? '--' : total}</span>
                  <span class="${deltaClass}">${deltaText}</span>
                  ${badges}
                </div>
              </td>
            `;
          }).join('');

          rows.push(`
            <tr class="${isCurrent ? 'current-round' : ''}">
              ${header}
              ${cells}
            </tr>
          `);
        }

        tableScrollEl.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>回合</th>
                ${headerCells}
              </tr>
            </thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        `;
      }

      function renderScoreboard(data) {
        if (!data || data.status === 'loading') {
          setStatus('计分数据加载中，请稍候...', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">正在等待主机推送比分...</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'error') {
          setStatus(data.message || '获取计分数据时出现错误', 'error');
          tableScrollEl.innerHTML = '<div class="empty">请检查主机端是否在线。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'no_player') {
          setStatus(data.message || '当前模板未配置玩家', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">请在主机端补充玩家后再试。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status !== 'ok') {
          setStatus(data.message || '计分数据准备中', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">计分尚未开始，稍后再来看看。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        setStatus('', null);

        const meta = data.meta || {};
        const players = data.playersOrdered || data.players || [];
        const ranking = data.players || [];
        const roundCount = meta.roundCount || 0;
        const templateSettings = meta.otherSettings || {};
        const templateBase = Number(templateSettings.baseScore ?? 1);
        const checkMultiplier = templateSettings.checkMultiplier ? '开启' : '关闭';
        const bombMode = templateSettings.bombMultiplyMode ? '炸弹加倍' : '炸弹累加';
        const updatedAt = formatTime(data.updatedAt);
        const templateName = meta.templateName || '实时比分';
        const currentRound = meta.currentRound ?? 0;

        titleEl.textContent = `${templateName} · 实时比分`;
        metaEl.textContent =
          `模板底分：${templateBase} ｜ 翻倍校验：${checkMultiplier} ｜ 炸弹：${bombMode} ｜ 当前回合：${currentRound} ｜ 刷新时间：${updatedAt}`;

        if (!players.length) {
          tableScrollEl.innerHTML = '<div class="empty">暂无玩家信息</div>';
          summaryEl.innerHTML = '';
          return;
        }

        const playerDetails = players.map(player => {
          const roundScores = Array.isArray(player.roundScores) ? player.roundScores : [];
          const roundExtended = Array.isArray(player.roundExtended) ? player.roundExtended : [];
          const totals = [];
          let cumulative = 0;
          for (let i = 0; i < roundCount; i++) {
            const delta = roundScores[i] ?? null;
            if (delta != null) {
              cumulative += Number(delta);
            }
            totals.push(cumulative);
          }
          return {
            id: player.playerId || player.id || player.name || '',
            name: player.name || '未知玩家',
            roundScores,
            roundExtended,
            totals,
          };
        });

        renderTable(playerDetails, roundCount, currentRound, templateBase);
        renderSummary(ranking, roundCount);

        const signature = createSignature(players, roundCount);
        const isInitial = state.lastSignature == null;
        const changed = state.lastSignature !== signature;
        if (changed) {
          requestAnimationFrame(() => scrollToBottom(tableScrollEl, !isInitial));
          state.lastSignature = signature;
        }
      }

      async function fetchScore() {
        try {
          const response = await fetch('/api/score', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('网络请求失败');
          }
          const data = await response.json();
          renderScoreboard(data);
        } catch (error) {
          setStatus('无法获取计分数据，请确认主机是否在线。', 'error');
          tableScrollEl.innerHTML = '<div class="empty">网络连接异常，请稍后刷新。</div>';
          summaryEl.innerHTML = '';
          console.error(error);
        }
      }

      fetchScore();
      setInterval(fetchScore, 2000);
    })();
</script>
</body>
</html>
