<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>得益计分 · 实时比分</title>
    <style>
        :root {
          color-scheme: light dark;
          font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          --surface-bg: #f5f7fb;
          --surface-card: #ffffff;
          --surface-border: rgba(15, 23, 42, 0.08);
          --text-primary: #0f172a;
          --text-secondary: rgba(15, 23, 42, 0.62);
          --accent: #0ea5e9;
          --positive: #16a34a;
          --negative: #dc2626;
          --table-head-bg: #e2f4fd;
        }

        html,
        body {
          margin: 0;
          height: 100%;
          overflow: hidden;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: stretch;
          background: var(--surface-bg);
          color: var(--text-primary);
          padding: 24px 16px 20px;
          box-sizing: border-box;
        }

        body[data-theme="dark"] {
          --surface-bg: #0f172a;
          --surface-card: rgba(30, 41, 59, 0.78);
          --surface-border: rgba(148, 163, 184, 0.26);
          --text-primary: #e2e8f0;
          --text-secondary: rgba(226, 232, 240, 0.7);
          --accent: #38bdf8;
          --table-head-bg: #1f2f44;
        }

        .container {
          width: min(1080px, 100%);
          display: flex;
          flex-direction: column;
          gap: 16px;
          max-height: 100%;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 16px;
        }

        .header-main {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
          flex: 1 1 320px;
        }

        .title-row {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 12px;
        }

        h1 {
          margin: 0;
          font-size: 28px;
          font-weight: 600;
        }

        .meta {
          margin: 0;
          font-size: 15px;
          color: var(--text-secondary);
          line-height: 1.5;
          word-break: break-word;
        }

        .status {
          border-radius: 12px;
          padding: 12px 16px;
          background: rgba(14, 165, 233, 0.12);
          border-left: 4px solid var(--accent);
          color: var(--accent);
          display: none;
        }

        .status.show {
          display: block;
        }

        .status.warn {
          background: rgba(245, 158, 11, 0.16);
          border-left-color: #f59e0b;
          color: #b45309;
        }

        body[data-theme="dark"] .status.warn {
          color: #fde68a;
        }

        .status.error {
          background: rgba(239, 68, 68, 0.16);
          border-left-color: #ef4444;
          color: #b91c1c;
        }

        body[data-theme="dark"] .status.error {
          color: #fecaca;
        }

        .scoreboard-card {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
          background: var(--surface-card);
          border-radius: 20px;
          border: 1px solid var(--surface-border);
          box-shadow: 0 18px 36px rgba(15, 23, 42, 0.08);
          padding: 20px;
        }

        .table-wrapper {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }

        .table-scroll {
          flex: 1;
          min-height: 0;
          overflow: auto;
          position: relative;
        }

        table {
          width: 100%;
          border-collapse: separate;
          border-spacing: 0;
          min-width: 640px;
        }

        thead th {
          background-color: var(--table-head-bg);
          font-weight: 600;
          text-align: center;
          padding: 14px 12px;
          border-bottom: 1px solid var(--surface-border);
          position: sticky;
          top: 0;
          z-index: 2;
        }

        tbody tr:nth-child(odd) {
          background: rgba(15, 23, 42, 0.02);
        }

        tbody tr:nth-child(even) {
          background: rgba(15, 23, 42, 0.04);
        }

        tbody tr.current-round {
          background: rgba(14, 165, 233, 0.16);
        }

        th,
        td {
          padding: 12px;
          text-align: center;
        }

        td .cell {
          position: relative;
          min-height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          font-weight: 600;
        }

        .cell .total.placeholder {
          color: var(--text-secondary);
          font-weight: 500;
        }

        .cell .delta {
          position: absolute;
          top: 6px;
          right: 8px;
          font-size: 12px;
          font-weight: 600;
          color: rgba(15, 23, 42, 0.5);
        }

        body[data-theme="dark"] .cell .delta {
          color: rgba(226, 232, 240, 0.68);
        }

        .cell .delta.positive {
          color: var(--positive);
        }

        .cell .delta.negative {
          color: var(--negative);
        }

        .cell .delta.placeholder {
          color: rgba(148, 163, 184, 0.7);
        }

        .summary-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 12px;
        }

        .summary-card {
          border-radius: 12px;
          padding: 12px;
          background: rgba(14, 165, 233, 0.12);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        body[data-theme="dark"] .summary-card {
          background: rgba(14, 165, 233, 0.22);
        }

        .summary-card h3 {
          margin: 0;
          font-size: 15px;
          font-weight: 600;
          color: var(--text-secondary);
        }

        .summary-card span {
          font-size: 24px;
          font-weight: 700;
          color: var(--accent);
        }

        .empty {
          padding: 48px 0;
          text-align: center;
          color: var(--text-secondary);
          font-size: 16px;
        }

        .promo-card {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 14px;
          border-radius: 12px;
          background: rgba(14, 165, 233, 0.12);
          border: 1px solid rgba(14, 165, 233, 0.2);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
          max-width: 360px;
        }

        body[data-theme="dark"] .promo-card {
          background: rgba(14, 165, 233, 0.24);
          border-color: rgba(148, 163, 184, 0.36);
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
        }

        .promo-qr {
          flex-shrink: 0;
          width: 76px;
          height: 76px;
          border-radius: 12px;
          border: 1px solid rgba(148, 163, 184, 0.3);
          background: #ffffff;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        body[data-theme="dark"] .promo-qr {
          border-color: rgba(148, 163, 184, 0.42);
          background: rgba(226, 232, 240, 0.05);
        }

        .promo-qr img {
          width: 100%;
          height: 100%;
          border-radius: 10px;
          object-fit: cover;
          image-rendering: pixelated;
          display: block;
        }

        .promo-text {
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12.5px;
        }

        .promo-text strong {
          font-size: 15px;
          font-weight: 600;
        }

        .promo-text span {
          color: rgba(15, 23, 42, 0.72);
          line-height: 1.4;
        }

        body[data-theme="dark"] .promo-text span {
          color: rgba(226, 232, 240, 0.7);
        }

        .promo-text a {
          color: #0284c7;
          font-weight: 600;
          text-decoration: none;
          white-space: nowrap;
        }

        body[data-theme="dark"] .promo-text a {
          color: #bae6fd;
        }

    @media (max-width: 820px) {
      body {
        padding: 16px 12px;
      }

      .container {
        height: auto;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      header > * {
        width: 100%;
      }

      .header-main {
        flex: none;
      }

      .scoreboard-card {
        flex: none;
        min-height: 420px;
      }

      .promo-card {
        width: 100%;
      }
    }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-main">
            <div class="title-row">
                <h1 id="title">实时比分</h1>
            </div>
            <p class="meta" id="meta">正在连接主机...</p>
        </div>
        <div class="promo-card">
            <div class="promo-qr">
                <img alt="下载二维码" src="/assets/qr-download.svg"/>
            </div>
            <div class="promo-text">
                <strong>下载「得益计分」App</strong>
                <span>支持多种计分与联赛管理，还可局域网实时联机</span>
                <a href="https://counters.devyi.com/download/?ref=lan" rel="noopener"
                   target="_blank">
                    counters.devyi.com/download
                </a>
            </div>
        </div>
    </header>

    <div class="status" id="status"></div>

    <div class="scoreboard-card">
        <div class="table-wrapper">
            <div class="table-scroll" id="tableScroll">
                <div class="empty">正在等待主机推送比分...</div>
            </div>
        </div>
        <div class="summary-grid" id="summary"></div>
    </div>
</div>

<script>
    (function () {
      const titleEl = document.getElementById('title');
      const statusEl = document.getElementById('status');
      const metaEl = document.getElementById('meta');
      const tableScrollEl = document.getElementById('tableScroll');
      const summaryEl = document.getElementById('summary');

      const state = {
        lastSignature: null,
      };

      function setStatus(message, level) {
        if (!message) {
          statusEl.className = 'status';
          statusEl.textContent = '';
          return;
        }
        statusEl.className = 'status show' + (level ? ' ' + level : '');
        statusEl.textContent = message;
      }

      function formatTime(isoString) {
        if (!isoString) return '未知时间';
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return '未知时间';
        return date.toLocaleTimeString();
      }

      function toPoint(value) {
        return (Number(value || 0) / 100).toFixed(2);
      }

      function createSignature(players, roundCount) {
        return JSON.stringify({
          roundCount,
          players: players.map(player => ({
            id: player.playerId || player.id || player.name || '',
            scores: Array.isArray(player.roundScores) ? player.roundScores : [],
            total: player.totalScore ?? 0,
          })),
        });
      }

      function scrollToBottom(el, smooth) {
        if (!el) return;
        const top = Math.max(el.scrollHeight - el.clientHeight, 0);
        el.scrollTo({
          top,
          behavior: smooth ? 'smooth' : 'auto',
        });
      }

      function renderSummary(players) {
        if (!players.length) {
          summaryEl.innerHTML = '';
          return;
        }
        summaryEl.innerHTML = players.map(player => `
          <div class="summary-card">
            <h3>${player.rank ? `第${player.rank}名 · ` : ''}${player.name || '未知玩家'}</h3>
            <span>${toPoint(player.totalScore ?? 0)}</span>
          </div>
        `).join('');
      }

      function renderTable(playerDetails, roundCount, currentRound) {
        if (!roundCount) {
          tableScrollEl.innerHTML = '<div class="empty">尚未开始计分，请稍候。</div>';
          return;
        }

        const headerCells = playerDetails
          .map(detail => `<th>${detail.name}</th>`)
          .join('');

        const bodyRows = [];
        for (let roundIndex = 0; roundIndex < roundCount; roundIndex++) {
          const isCurrent = currentRound === roundIndex + 1;
          const cells = playerDetails.map(detail => {
            const deltaRaw = detail.roundScores[roundIndex];
            const delta = deltaRaw != null ? Number(deltaRaw) : null;
            const total = detail.totals[roundIndex] ?? 0;

            const totalClass = delta == null ? 'total placeholder' : 'total';
            const totalText = delta == null ? '--' : toPoint(total);

            let deltaClass = 'delta placeholder';
            let deltaText = '--';
            if (delta != null) {
              if (delta > 0) {
                deltaClass = 'delta positive';
              } else if (delta < 0) {
                deltaClass = 'delta negative';
              } else {
                deltaClass = 'delta';
              }
              const prefix = delta > 0 ? '+' : '';
              deltaText = `${prefix}${toPoint(delta)}`;
            }

            return `
              <td>
                <div class="cell">
                  <span class="${totalClass}">${totalText}</span>
                  <span class="${deltaClass}">${deltaText}</span>
                </div>
              </td>
            `;
          }).join('');

          bodyRows.push(`
            <tr class="${isCurrent ? 'current-round' : ''}">
              <th>第${roundIndex + 1}局</th>
              ${cells}
            </tr>
          `);
        }

        tableScrollEl.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>局数</th>
                ${headerCells}
              </tr>
            </thead>
            <tbody>${bodyRows.join('')}</tbody>
          </table>
        `;
      }

      function renderScoreboard(data) {
        if (!data || data.status === 'loading') {
          setStatus('计分数据加载中，请稍候...', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">正在等待主机推送比分...</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'error') {
          setStatus(data.message || '获取计分数据时出现错误', 'error');
          tableScrollEl.innerHTML = '<div class="empty">请检查主机端是否在线。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status === 'no_player') {
          setStatus(data.message || '当前模板未配置玩家', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">请在主机端补充玩家后再试。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        if (data.status !== 'ok') {
          setStatus(data.message || '计分数据准备中', 'warn');
          tableScrollEl.innerHTML = '<div class="empty">计分尚未开始，稍后再来看看。</div>';
          summaryEl.innerHTML = '';
          return;
        }

        setStatus('', null);

        const meta = data.meta || {};
        const players = data.playersOrdered || data.players || [];
        const ranking = data.players || [];
        const roundCount = meta.roundCount || 0;
        const updatedAt = formatTime(data.updatedAt);
        const settings = meta.otherSettings || {};
        const baseScore = settings.baseScore ?? 1;
        const checkMultiplier = settings.checkMultiplier ? '开启' : '关闭';
        const bombMode = settings.bombMultiplyMode ? '炸弹加倍' : '炸弹累加';
        const templateName = meta.templateName || '实时比分';
        const currentRound = meta.currentRound ?? 0;

        titleEl.textContent = `${templateName} · 实时比分`;
        metaEl.textContent =
          `底分：${baseScore} ｜ 番倍校验：${checkMultiplier} ｜ 炸弹：${bombMode} ｜ 当前回合：${currentRound} ｜ 刷新时间：${updatedAt}`;

        if (!players.length) {
          tableScrollEl.innerHTML = '<div class="empty">暂无玩家信息</div>';
          summaryEl.innerHTML = '';
          return;
        }

        const playerDetails = players.map(player => {
          const roundScores = Array.isArray(player.roundScores) ? player.roundScores : [];
          const totals = [];
          let cumulative = 0;
          for (let i = 0; i < roundCount; i++) {
            const delta = roundScores[i] ?? null;
            if (delta != null) {
              cumulative += Number(delta);
            }
            totals.push(cumulative);
          }
          return {
            id: player.playerId || player.id || player.name || '',
            name: player.name || '未知玩家',
            roundScores,
            totals,
          };
        });

        renderTable(playerDetails, roundCount, currentRound);
        renderSummary(ranking);

        const signature = createSignature(players, roundCount);
        const isInitial = state.lastSignature == null;
        const changed = state.lastSignature !== signature;
        if (changed) {
          requestAnimationFrame(() => scrollToBottom(tableScrollEl, !isInitial));
          state.lastSignature = signature;
        }
      }

      async function fetchScore() {
        try {
          const response = await fetch('/api/score', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('网络请求失败');
          }
          const data = await response.json();
          renderScoreboard(data);
        } catch (error) {
          setStatus('无法获取计分数据，请确认主机是否在线。', 'error');
          tableScrollEl.innerHTML = '<div class="empty">网络连接异常，请稍后刷新。</div>';
          summaryEl.innerHTML = '';
          console.error(error);
        }
      }

      fetchScore();
      setInterval(fetchScore, 2000);
    })();
</script>
</body>
</html>
